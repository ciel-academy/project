name: Prepare CIEL v2.6.10 integration
on:
  push:
    branches: ['update/cl-v2.6.10']
    paths: ['.github/workflows/prepare-ciel-v26.yml', '.github/ciel-update/prepare.py']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pinned read-only source
        run: git fetch https://github.com/hada-notion/project1.git ffa61566a7e9ce4dfcf0dd740b4657747379fadb
      - name: Apply source preserving CIEL deployment settings
        run: |
          python3 .github/ciel-update/prepare.py
          rm -f .github/ciel-update/prepare.py .github/ciel-update/validation-error.txt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Isolated function tests
        run: |
          set -o pipefail
          deno test --allow-env --allow-read=admin_settings.js supabase/functions/_shared/*_test.ts supabase/functions/generate-classes/index_test.ts supabase/functions/sync-attendance/index_test.ts 2>&1 | tee "$RUNNER_TEMP/ciel-tests.log"
      - name: Type-check all functions
        run: |
          set -eo pipefail
          for f in supabase/functions/*/index.ts; do deno check "$f"; done 2>&1 | tee "$RUNNER_TEMP/ciel-typecheck.log"
      - name: Regression guard
        run: |
          set -o pipefail
          bash scripts/check-known-regressions.sh 2>&1 | tee "$RUNNER_TEMP/ciel-regressions.log"
      - name: Design rules
        run: |
          set -o pipefail
          node tests/design-lint.cjs 2>&1 | tee "$RUNNER_TEMP/ciel-design.log"
      - name: Test SQL with isolated simulated PostgreSQL
        run: |
          set -e
          npm install --prefix "$RUNNER_TEMP/ciel-sql" @electric-sql/pglite@0.5.8 --no-audit --no-fund
          export PGLITE_MODULE="$RUNNER_TEMP/ciel-sql/node_modules/@electric-sql/pglite"
          node tests/admin-security-sql.cjs
          node tests/class-room-copy-sql.cjs
          node tests/class-room-copy-cron-sql.cjs
      - name: Commit verified integration on preparation branch only
        run: |
          set -eo pipefail
          test "${GITHUB_REF_NAME}" = "update/cl-v2.6.10"
          rm -f .github/ciel-update/prepare.py .github/ciel-update/validation-error.txt
          # Workflow changes are applied with the authorized GitHub MCP connection, not the runner token.
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat: prepare v2.6.10 preserving CIEL environment and historical migrations"
          git push origin HEAD:refs/heads/update/cl-v2.6.10 2>&1 | tee "$RUNNER_TEMP/ciel-push.log"
      - name: Record sanitized validation diagnostics on preparation branch
        if: failure()
        run: |
          set -eo pipefail
          test "${GITHUB_REF_NAME}" = "update/cl-v2.6.10"
          python3 - <<'PYDIAG'
          import os,re
          from pathlib import Path
          lines=[]
          for p in sorted(Path(os.environ['RUNNER_TEMP']).glob('ciel-*.log')):
              text='\n'.join(p.read_text(errors='replace').splitlines()[-45:])
              text=re.sub(r'eyJ[A-Za-z0-9_.-]+|(?:sbp_|gh[pousr]_)[A-Za-z0-9_]+','[redacted]',text)
              lines.extend([p.name,text])
          Path('.github/ciel-update').mkdir(parents=True,exist_ok=True)
          Path('.github/ciel-update/validation-error.txt').write_text('\n\n'.join(lines))
          PYDIAG
          git reset --mixed "$GITHUB_SHA"
          git add .github/ciel-update/validation-error.txt
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --only .github/ciel-update/validation-error.txt -m "docs: isolated validation diagnostics"
          git push origin HEAD:refs/heads/update/cl-v2.6.10
